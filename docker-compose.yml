# Optio-New — practical v1 Compose stack (SPEC §12.6)
# Load env via `bash scripts/secrets.sh compose` (sops+age). See docs/secrets.md.
# A bare `docker compose up` uses ${VAR:-changeme} defaults, not the host ciphertext.
# orchestrator and eve-runner interpolate CURSOR_API_KEY, OPTIO_NEW_GITHUB_TOKEN,
# MODEL_API_KEY, and MODEL_ENDPOINT from that env file. Values stay out of git.
# Default `up` (no profile): redis, postgres, litellm.
# orchestrator is profiles `full` and `orchestrator`. eve-runner is profiles `full` and `eve` on 127.0.0.1:3210.
# learning-worker is profile `learn` (queue optio.learn).
# `--profile harness` adds kit-harness on 127.0.0.1:3200.
# Factory data plane: docker compose --profile full --profile harness up -d
# Host ports: OPTIO_NEW_REDIS_HOST_PORT, OPTIO_NEW_POSTGRES_HOST_PORT, OPTIO_NEW_LITELLM_HOST_PORT.
name: optio-new

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPTIO_NEW_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - optio_new_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OPTIO_NEW_POSTGRES_USER:-optio}
      POSTGRES_PASSWORD: ${OPTIO_NEW_POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${OPTIO_NEW_POSTGRES_DB:-optio_new}
    ports:
      - "127.0.0.1:${OPTIO_NEW_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - optio_new_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${OPTIO_NEW_POSTGRES_USER:-optio} -d ${OPTIO_NEW_POSTGRES_DB:-optio_new}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Intake HTTP (:3100) + BullMQ stage workers.
  # Profile full keeps `docker compose --profile full` working.
  # Profile orchestrator is the Hetzner boot set (see deploy/README.md).
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    profiles: ["full", "orchestrator"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Root so git worktree can register branches on the host checkout (often root-owned).
    user: "0:0"
    environment:
      ORCHESTRATOR_PORT: "3100"
      OPTIO_NEW_INTAKE_WEBHOOK_SECRET: ${OPTIO_NEW_INTAKE_WEBHOOK_SECRET:-}
      OPTIO_NEW_REDIS_URL: redis://redis:6379
      OPTIO_NEW_DATABASE_URL: postgres://${OPTIO_NEW_POSTGRES_USER:-optio}:${OPTIO_NEW_POSTGRES_PASSWORD:-changeme}@postgres:5432/${OPTIO_NEW_POSTGRES_DB:-optio_new}
      OPTIO_NEW_REPO_PATH: /opt/optio-new
      OPTIO_NEW_WORKTREE_ROOT: /var/lib/optio-new/worktrees
      OPTIO_NEW_WORKTREE_RETAIN_ON_FAILURE: ${OPTIO_NEW_WORKTREE_RETAIN_ON_FAILURE:-true}
      OPTIO_NEW_BASE_BRANCH: ${OPTIO_NEW_BASE_BRANCH:-development}
      OPTIO_NEW_GITHUB_REPO: ${OPTIO_NEW_GITHUB_REPO:-}
      OPTIO_NEW_GITHUB_TOKEN: ${OPTIO_NEW_GITHUB_TOKEN:-}
      OPTIO_NEW_GITHUB_WEBHOOK_SECRET: ${OPTIO_NEW_GITHUB_WEBHOOK_SECRET:-}
      OPTIO_NEW_SLACK_SIGNING_SECRET: ${OPTIO_NEW_SLACK_SIGNING_SECRET:-}
      OPTIO_NEW_LINEAR_API_KEY: ${OPTIO_NEW_LINEAR_API_KEY:-}
      OPTIO_NEW_LINEAR_WEBHOOK_SECRET: ${OPTIO_NEW_LINEAR_WEBHOOK_SECRET:-}
      OPTIO_NEW_LINEAR_DEFAULT_REPO_ID: ${OPTIO_NEW_LINEAR_DEFAULT_REPO_ID:-}
      OPTIO_NEW_LINEAR_PROJECTS_CONFIG: ${OPTIO_NEW_LINEAR_PROJECTS_CONFIG:-}
      LINEAR_WORKFLOW_CI_FAIL_ESCALATE_AFTER: ${LINEAR_WORKFLOW_CI_FAIL_ESCALATE_AFTER:-3}
      OPTIO_NEW_REPOS: ${OPTIO_NEW_REPOS:-}
      OPTIO_NEW_DEFAULT_REPO_ID: ${OPTIO_NEW_DEFAULT_REPO_ID:-default}
      OPTIO_NEW_REPO_CLONE_URL: ${OPTIO_NEW_REPO_CLONE_URL:-}
      OPTIO_NEW_MIN_FREE_DISK_BYTES: ${OPTIO_NEW_MIN_FREE_DISK_BYTES:-2147483648}
      OPTIO_NEW_MIN_FREE_INODES: ${OPTIO_NEW_MIN_FREE_INODES:-10000}
      OPTIO_NEW_MIN_AVAILABLE_MEMORY_BYTES: ${OPTIO_NEW_MIN_AVAILABLE_MEMORY_BYTES:-536870912}
      OPTIO_NEW_DOCKER_DATA_ROOT: ${OPTIO_NEW_DOCKER_DATA_ROOT:-/var/lib/docker}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      # Image bakes glibc `agent` on PATH. Empty keeps that binary.
      CURSOR_AGENT_BIN: ${CURSOR_AGENT_BIN:-}
      # Literal: host OPTIO_CURSOR_SANDBOX must not re-enable the AppArmor sandbox.
      OPTIO_CURSOR_SANDBOX: disabled
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:-}
      OPTIO_HITL_PLAN: ${OPTIO_HITL_PLAN:-}
      OPTIO_HITL_MERGE: ${OPTIO_HITL_MERGE:-}
      OPTIO_HITL_CONFIDENCE_THRESHOLD: ${OPTIO_HITL_CONFIDENCE_THRESHOLD:-}
      OPTIO_HITL_TIMEOUT_MS: ${OPTIO_HITL_TIMEOUT_MS:-}
      OPTIO_HITL_POLL_MS: ${OPTIO_HITL_POLL_MS:-}
      OPTIO_TASK_MAX_TOKENS: ${OPTIO_TASK_MAX_TOKENS:-}
      OPTIO_TASK_MAX_USD: ${OPTIO_TASK_MAX_USD:-}
      OPTIO_NEW_ARTIFACT_RETENTION_DAYS: ${OPTIO_NEW_ARTIFACT_RETENTION_DAYS:-14}
      OPTIO_NEW_ARTIFACT_MAX_BYTES: ${OPTIO_NEW_ARTIFACT_MAX_BYTES:-16384}
      OPTIO_NEW_ARTIFACT_MAX_ROWS: ${OPTIO_NEW_ARTIFACT_MAX_ROWS:-2000}
      JEV_BASE_URL: ${JEV_BASE_URL:-https://ai-gateway.vercel.sh}
      VERCEL_AI_GATEWAY_URL: ${VERCEL_AI_GATEWAY_URL:-https://ai-gateway.vercel.sh}
      OPTIO_OTEL_LANGFUSE: ${OPTIO_OTEL_LANGFUSE:-false}
      OPTIO_OTEL_SIGNOZ: ${OPTIO_OTEL_SIGNOZ:-false}
      OPTIO_SIGNOZ_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://127.0.0.1:3000}
    volumes:
      - ${OPTIO_NEW_REPO_PATH:-/opt/optio-new}:/opt/optio-new
      - optio_new_worktrees:/var/lib/optio-new/worktrees
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Eve runner. One step per request; does not advance the BullMQ graph.
  eve-runner:
    build:
      context: .
      dockerfile: Dockerfile.eve-runner
    profiles: ["full", "eve"]
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    # Root so a CodingAgent can write the host checkout. Same secret names as orchestrator.
    user: "0:0"
    environment:
      OPTIO_NEW_REDIS_URL: redis://redis:6379
      EVE_RUNNER_HOST: 0.0.0.0
      EVE_RUNNER_PORT: "3210"
      OPTIO_NEW_REPO_PATH: /opt/optio-new
      OPTIO_NEW_REPO_ROOT: /opt/optio-new
      OPTIO_NEW_WORKTREE_ROOT: /var/lib/optio-new/worktrees
      OPTIO_NEW_GITHUB_REPO: ${OPTIO_NEW_GITHUB_REPO:-}
      OPTIO_NEW_GITHUB_TOKEN: ${OPTIO_NEW_GITHUB_TOKEN:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_AGENT_BIN: ${CURSOR_AGENT_BIN:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:-}
    volumes:
      - ${OPTIO_NEW_REPO_PATH:-/opt/optio-new}:/opt/optio-new
      - optio_new_worktrees:/var/lib/optio-new/worktrees
    ports:
      - "127.0.0.1:3210:3210"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3210/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    volumes:
      - ./gateway/litellm/config.yaml.example:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:${OPTIO_NEW_LITELLM_HOST_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:4000/health/liveliness'')"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Decision sidecar (SPEC §9, §14.4 Hop 1). Off unless `--profile harness`.
  kit-harness:
    profiles: ["harness"]
    build:
      context: .
      dockerfile: Dockerfile.kit-harness
    restart: unless-stopped
    init: true
    environment:
      KIT_HARNESS_PORT: ${KIT_HARNESS_PORT:-3200}
      JEV_BASE_URL: ${JEV_BASE_URL:-}
    ports:
      - "127.0.0.1:${KIT_HARNESS_PORT:-3200}:${KIT_HARNESS_PORT:-3200}"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.KIT_HARNESS_PORT||3200)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Failure fingerprints → learnings table and optional GitHub meta-issues (SPEC §10).
  learning-worker:
    profiles: ["learn"]
    build:
      context: .
      dockerfile: Dockerfile.learning-worker
    restart: unless-stopped
    init: true
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      OPTIO_NEW_REDIS_URL: redis://redis:6379
      OPTIO_NEW_DATABASE_URL: postgres://${OPTIO_NEW_POSTGRES_USER:-optio}:${OPTIO_NEW_POSTGRES_PASSWORD:-changeme}@postgres:5432/${OPTIO_NEW_POSTGRES_DB:-optio_new}
      OPTIO_LEARN_THRESHOLD: ${OPTIO_LEARN_THRESHOLD:-3}
      OPTIO_LEARN_WINDOW_DAYS: ${OPTIO_LEARN_WINDOW_DAYS:-14}
      OPTIO_LEARN_FILE_GITHUB: ${OPTIO_LEARN_FILE_GITHUB:-}
      OPTIO_LEARN_GITHUB_REPO: ${OPTIO_LEARN_GITHUB_REPO:-}
      OPTIO_NEW_GITHUB_TOKEN: ${OPTIO_NEW_GITHUB_TOKEN:-}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # Optional local Laya decision service (SPEC §14.3). Off unless `--profile laya`.
  # Placeholder stdlib server (deploy/laya/stub_server.py). Upstream Laya has no
  # published registry image; build laya-serve from NandhaKishorM/laya to replace
  # it (docs/laya.md). CPU only: LAYA_DEVICE is pinned to cpu. Do not add a GPU
  # reservation. The NVIDIA Container Toolkit is not required and is not used.
  laya:
    profiles: ["laya"]
    image: python:3.12-slim
    restart: unless-stopped
    init: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      LAYA_DEVICE: cpu
      LAYA_HOST: 0.0.0.0
      LAYA_PORT: "8000"
      LAYA_PRELOAD: ${LAYA_PRELOAD:-0}
      LAYA_THREADS: ${LAYA_THREADS:-4}
      LAYA_API_KEY: ${LAYA_API_KEY:-}
    command: ["python", "-B", "-u", "/app/stub_server.py"]
    volumes:
      - ./deploy/laya/stub_server.py:/app/stub_server.py:ro
    ports:
      - "127.0.0.1:${OPTIO_NEW_LAYA_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    # Debug sink. App export stays off until OPTIO_OTEL_LANGFUSE / OPTIO_OTEL_SIGNOZ=true.
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    profiles: ["observability"]

  # langfuse:
  #   # Self-hosted Langfuse (MIT) — enable when ClickHouse+Postgres+Redis capacity allows.
  #   # Prefer sessions keyed by task_id / session id.
  #   image: langfuse/langfuse:latest
  #   profiles: ["observability"]

  # signoz:
  #   # SigNoz all-in-one — infra traces/logs/metrics; keep agent deep-dive in Langfuse.
  #   # image: signoz/signoz:latest
  #   profiles: ["observability"]

  # IP HTTP edge for /webhooks/*. Profile `edge` (on in the VPS boot unit).
  # Publishes :80 (catch-all) and :443 (mapped, unused until a domain+TLS Caddyfile).
  # Orchestrator stays on 127.0.0.1:3100. See docs/ops/caddy-tls-edge.md.
  # WEBHOOK_HOST and ACME_EMAIL are unused in IP mode; they feed a later TLS swap.
  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    environment:
      OPTIO_NEW_WEBHOOK_HOST: ${OPTIO_NEW_WEBHOOK_HOST:-localhost}
      OPTIO_NEW_ACME_EMAIL: ${OPTIO_NEW_ACME_EMAIL:-tls-edge@localhost.invalid}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - optio_new_caddy_data:/data
      - optio_new_caddy_config:/config

  # Placeholder only (profile: caveman). Does not install or run the BSL engine.
  # Host enable path: caveman setup --install, then
  #   CAVEMAN_MODE=compress CAVE_SSRF_ALLOWLIST=127.0.0.1 caveman start
  # See gateway/caveman/caveman.yaml.example and src/proxy/README.md.
  caveman-proxy:
    profiles: ["caveman"]
    image: node:20-alpine
    working_dir: /app
    command:
      - sh
      - -lc
      - "echo 'Install @caveman-ai/cli on the host or replace this stub with your proxy image'; sleep infinity"
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  optio_new_redis:
  optio_new_postgres:
  optio_new_worktrees:
  optio_new_caddy_data:
  optio_new_caddy_config:
