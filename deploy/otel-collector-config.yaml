# Optio-New OTel Collector stub.
# Local debug sink for traces. Langfuse and SigNoz export stays off until
# OPTIO_OTEL_LANGFUSE / OPTIO_OTEL_SIGNOZ are the string "true".
# Point OPTIO_SIGNOZ_OTLP_ENDPOINT at this collector (:4318) or at SigNoz.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
