name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Do not enable step debug and do not inject production env here.
  # scripts/secrets.sh audit (via npm test and smoke) prints paths only.
  smoke:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Upload harness eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-eval
          path: eval-reports/
          if-no-files-found: ignore

      - name: Smoke
        run: bash scripts/smoke-local.sh
