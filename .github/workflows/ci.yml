name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Do not enable step debug and do not inject production env here.
  # scripts/secrets.sh audit (via npm test and smoke) prints paths only.
  smoke:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Postgres and Redis (the images in docker-compose.yml) so the
    # integration tests that skip without these URLs run here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: optio
          # No password in the file: the container lives only for this job.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: optio_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U optio" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPTIO_NEW_DATABASE_URL: postgres://optio@localhost:5432/optio_ci
      OPTIO_NEW_REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Upload harness eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-eval
          path: eval-reports/
          if-no-files-found: ignore

      - name: Smoke
        run: bash scripts/smoke-local.sh
