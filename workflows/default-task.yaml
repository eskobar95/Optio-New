# workflows/default-task.yaml — Optio-New default task workflow (spec §3.2)
# Driven by New Bot gates + BullMQ — not Linear status vocabulary.
name: default-task
trigger: bot.intake.created
base_branch: development

steps:
  - id: planner
    permission_tier: read-only
    agent: agents/planner
    skill_budget_mode: short_term # see SPEC §6
    specialists_allowed: []
    skills_allowed: [skills/_shared, skills/bot-session]
    entry_gates: [session_acked]
    exit_gates: [plan_present, jev_route_ok]
    on_fail: escalate_bot

  - id: implementation
    permission_tier: edit-worktree
    agent: agents/implementation
    skill_budget_mode: short_term # later: orchestrator_restricted
    specialists_allowed:
      - specialists/front-end
      - specialists/back-end
      - specialists/devops
      - specialists/database
    skills_allowed: from_planner_selection # intersected with global allow-list
    entry_gates: [worktree_ready, plan_approved]
    exit_gates: [jev_completion, local_checks]
    on_fail: retry_then_replan

  - id: review
    permission_tier: read-only
    agent: agents/review
    specialists_allowed: []
    skills_allowed: [skills/code-review]
    entry_gates: [diff_present]
    exit_gates: [jev_review_pass]
    on_fail: return_to_implementation

  - id: ready
    permission_tier: git-push
    agent: agents/ready
    skills_allowed: [skills/land, skills/sync-development]
    # review_pass = evaluateReviewGate: tests green + CI success + Jev/rules completion.
    # pr_safety = tests, lint, typecheck, and diff review before open_pr.
    # A closed pr_safety gate does not push. See docs/review-gate.md.
    entry_gates: [review_pass, pr_safety]
    exit_gates: [pr_open, ci_pending_or_green]
    on_fail: escalate_bot

  - id: merge
    permission_tier: git-push
    agent: agents/merge
    skills_allowed: [skills/land, skills/reap-worktree]
    # pr_safety runs again before merge_branch. See docs/review-gate.md.
    entry_gates: [ci_green, merge_policy_allow, pr_safety]
    exit_gates: [merged_into_development]
    on_success: delete_worktree
